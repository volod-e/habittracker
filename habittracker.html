                    <div class="days">

                        <div class="day">1</div>
                        <div class="day">1</div>

                        <div class="day">1</div>
                    </div>

<style>
    body{
        background-image: url("../images/yobaniyai.jpg");
        background-size: 100%;
        background-color: rgba(114, 7, 7, 0.751);
        background-blend-mode: lighten;
        text-align: center;
    }

    #title{
        margin-top: 100px;
        line-height: 10px;
    }

    #subtitle{
        opacity: 0.7;
        font-size: 18px;
        margin-bottom: 20px;
    }

    #calendarContainer{
        display: flex;
        justify-content: end;
    }

    #calendarDiv{
        background-color: white;
        border-radius: 10px 10px 20px 20px;
        margin: auto;
        align-content: center;
        text-align: center;
        width: 40%;
    }

    #calendarHeading{
        display: flex;
        justify-content: space-between;
        border-radius: 10px 10px 0px 0px;
        border: 2px solid black;
        padding: 0px 20px;
        font-size: 20px;
        background-color: darkred;
        line-height: 0px;
    }

    #calendarContent{
        padding: 20px;
        border: 2px solid black;
        border-radius: 0px 0px 20px 20px;
    }

    .days{
        display: flex;   
        justify-content: space-between;   
    }

    .day{
        width: 20px;
        margin: 3px;
        padding: 10px;
        font-size: 18px;
        text-align: center;
        border-radius: 40px;
        border: 2px solid black;
        background-color: darkred;
    }
</style>
