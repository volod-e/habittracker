<style>
    body{
        background-image: url("../images/redpixelstars.jpg");
        background-size: 400px;
        background-color: rgba(87, 1, 1, 0.897);
        background-blend-mode:exclusion;
        text-align: center;
        font-family: "Press Start", sans-serif;
    }

    #title{
        margin-top: 100px;
        line-height: 10px;
    }

    #subtitle{
        opacity: 0.7;
        font-size: 18px;
        margin-bottom: 20px;
    }

    #calendarContainer{
        display: flex;
        justify-content: center;
        margin-bottom: 200px;
    }

    #calendarDiv{
        background-color: rgb(245, 169, 169);
        border-radius: 10px 10px 10px 10px;
        margin: auto;
        align-content: center;
        text-align: center;
        width: 45%;
    }

    #calendarHeading{
        display: flex;
        justify-content: space-between;
        border-radius: 10px 10px 0px 0px;
        border: 2px solid black;
        border-bottom: 0;
        padding: 2px 20px 0px 20px;
        font-size: 20px;
        background-color: darkred;
        line-height: 0px;
    }

    #calendarContent{
        padding: 20px;
        border: 2px solid black;
        border-radius: 0px 0px 10px 10px;
    }

    #weekdays{
        display: flex;
        justify-content:space-around;
    }

    .weekday{
        width: 40px;
        margin: 3px;
        font-size: 14px;
        text-align: center;
    }

    .days{
        display: flex;   
        justify-content: space-around;   
    }

    .day{
        width: 25px;
        margin: 3px;
        padding: 10px;
        font-size: 14px;
        text-align: center;
        border-radius: 20px;
        /* background-color: darkred; */
        cursor: pointer;
    }

    #resetButton{
        background-color: transparent;
        color: darkred;
        border: 2px solid darkred;
        padding: 10px 20px;
        margin-top: 20px;
        border-radius: 12px;
        font-size: 20px;
        font-family: "Press Start";
        /* font-weight: 600; Чуть жирнее */
        transition: all 0.25s ease; /* Плавность изменений */
        cursor: pointer; /* Курсор-рука при наведении */
    }

        /* --- ЧТО ПРОИСХОДИТ ПРИ НАВЕДЕНИИ --- */
        #resetButton:hover {
        /* При наведении фон заполняется цветом, а текст становится белым */
        background-color: darkred;
        color: black;
        /* Кнопка приподнимается */
        /* transform: translateY(-2px); */
    }
</style>

<script>
    var date = new Date();
    console.log(date);

    // GET THE DATE INFO
    var currentMonth = date.getMonth();
    var currentDay = date.getDay();
    var currentDate = date.getDate();
    var currentYear = date.getFullYear();

    console.log("The current month is " + currentMonth); //months start with 0
    console.log("The current weekday is " + currentDay); //day of the week
    console.log("The current date is " + currentDate);
    console.log("The current year is " + currentYear);

    var months = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"
    ];
    // SET THE CURRENT MONTH
    var title = document.getElementById("title");
    title.innerHTML = months[currentMonth];
     
    // UPDATE THE HABIT
     var habitTitle = document.getElementById("habitTitle");
     habitTitle.onclick = function () {
        let habits = prompt("What's your habit?", habitTitle.innerHTML = "Enter a new habit")
        if (habits.length == 0) {
            habitTitle.innerHTML = "Click to set your habit";
        } else {
            habitTitle.innerHTML = habits;
        }
     }

    //  SET THE TOTAL DAYS
     var daysInMonths = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
     var daysInThisMonth = daysInMonths[currentMonth];

     var daysCompleted = 0;
     var totalDays = document.getElementById("totalDays");

    //  SETUP THE CALENDAR DAYS
     var dayCount = 0;
     var rowCount = 0;
     var days = document.getElementsByClassName("days");

     for (var i = 0; i < days.length; i++) {
        var day = days[rowCount].getElementsByClassName("day");
        for (var j = 0; j < day.length; j++) {

            // add a border to the current date
            if (dayCount == currentDate - 1) {
                day[j].setAttribute("style", "color: darkred");
                day[j].setAttribute("style", "border: 2px solid black");
            }

            // update the current day and hide excess days
            if (dayCount < daysInThisMonth) {
                day[j].innerHTML = dayCount + 1;
                day[j].setAttribute("id", "day" + (dayCount + 1));
                dayCount++;
            } else {
                day[j].innerHTML = "";
                day[j].setAttribute("style", "background-color:  rgb(245, 169, 169)");
            }
        }
        rowCount++;
     }

    //  INITIALIZE COMPLETED ARRAY
    var completed = new Array(31);
    for (var i = 0; i < dayCount; i++) {
        var tempString = "" + (currentMonth + 1) + "-" + (i + 1) + "-" + currentYear;
        console.log("Storing date: " + tempString);
        var tempDay = localStorage.getItem(tempString);
        console.log(tempDay);
        if (tempDay == null || tempDay == "false") {
            localStorage.setItem(tempString, "false");
        } else if (tempDay == "true") {
            daysCompleted++;
        }
        totalDays.innerHTML = daysCompleted + "/" + daysInThisMonth;
    }

    console.log("Completed array: " + completed);
    console.log("Total days completed" + daysCompleted);

    // UPDATE COMPLETED ARRAY
    for (var i = 0; i < currentDate; i++) {
        var tempString = "" + (currentMonth + 1) + "-" + (i + 1) + "-" + currentYear;
        console.log(tempString);

        var chosenDay = localStorage.getItem(tempString);
        console.log(i + 1 + ":" + chosenDay);
        var chosenDayDiv = document.getElementById("day" + (i + 1));
        if (chosenDay == "true") {
            chosenDayDiv.style.backgroundColor = "darkred";
        } else if (chosenDay == "false") {
            chosenDayDiv.style.backgroundColor = "rgb(245, 169, 169)";
        }
    }


    // UPDATE COMPLETED ON CALENDAR
    var dayDivs = document.querySelectorAll(".day");
    for (var i = 0; i < currentDate; i++) {
        dayDivs[i].onclick = function (e) {
            var num = e.target.innerText;
            var selectedDate = document.getElementById(e.target.id);
            var storageString = "" + (currentMonth + 1) + "-" + num + "-" + currentYear;

            if (localStorage.getItem(storageString) == "false") {
                selectedDate.style.backgroundColor = "darkred";
                localStorage.setItem(storageString, "true");
                daysCompleted++;
            } else if (localStorage.getItem(storageString) == "true") {
                selectedDate.style.backgroundColor = "rgb(245, 169, 169)";
                localStorage.setItem(storageString, "false");
                daysCompleted--;
            }

            totalDays.innerHTML = daysCompleted + "/" + dayCount;
            console.log(daysCompleted, currentDate);
            if (daysCompleted == currentDate) {
                alert("Great job!");
            }
        }
    }


    // RESET BUTTON
    var resetButton = document.getElementById("resetButton");
    resetButton.onclick = function () {
        for (var i = 0; i < dayCount; i++) {
            var tempStrings = "" + (currentMonth + 1) + "-" + (i + 1) + "-" + currentYear;
            console.log(tempStrings);
            localStorage.setItem(tempStrings, "false");
            var curDay = document.getElementById("day" + (i + 1));
            curDay.style.backgroundColor = "rgb(245, 169, 169)";
        }
        daysCompleted = 0;
        totalDays.innerHTML = daysCompleted + "/" + daysInThisMonth;
    };
</script>
